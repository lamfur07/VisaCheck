name = "visacheck-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# Comma separated list of sites allowed to call this proxy, e.g.
# "https://lamfur07.github.io,http://localhost:8000"
ALLOWED_ORIGINS = "https://lamfur07.github.io,http://localhost:8000"

# The RapidAPI key is NOT stored here. Run:  wrangler secret put RAPIDAPI_KEY

# Settings for Cloudflare preview builds (non-production branches).
# Previews only accept local testing, never your live site, so a preview can't spend the production quota.
[previews.vars]
ALLOWED_ORIGINS = "http://localhost:8000"
